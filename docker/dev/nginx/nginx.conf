server {

    listen 81;
    server_name localhost;

    root /app/dist/spa;
    index index.html;

    gzip on;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    #
    # Cuando la URL empieza con /sistema
    #
    location ^~ /sistema/ {

        rewrite ^/sistema(/.*)$ $1 break;

        try_files $uri $uri/ /index.html;

    }

    #
    # Assets
    #
    location /assets/ {

        try_files $uri =404;

        expires 1y;

        access_log off;

        add_header Cache-Control "public";

    }

    #
    # SPA
    #
    location / {

        try_files $uri $uri/ /index.html;

    }

}